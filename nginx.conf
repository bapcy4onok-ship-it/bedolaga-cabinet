server {
    listen 80;
    # IPv6-слушателя намеренно нет: на хосте ledokol.shop IPv6 отключён и в
    # ядре, и в Docker, а `listen [::]:80` там роняет nginx с
    # "socket() [::]:80 failed (97: Address family not supported by protocol)".
    # Исходная причина той строки (healthcheck ходил на localhost -> [::1])
    # снята: healthcheck в docker-compose.yml идёт на 127.0.0.1.
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback
    location / {
        try_files $uri /index.html;
    }

    # API проксировать, если нужно
    location /api/ {
        try_files $uri /index.html;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Optional: кэширование статических файлов
    location ~* \.(?:ico|css|js|gif|jpe?g|png|woff2?|eot|ttf|svg)$ {
        expires 1y;
        access_log off;
        add_header Cache-Control "public";
    }
}
